# Server configuration
server.port=8080

# Default loan period (days) when no media-specific override exists
loan.default.days=14

# Loan periods by media type (days)
loan.days.Book=21
loan.days.Dvd=7
loan.days.Magazine=14

# Default fine rate (pence per day) when no media-specific override exists
fine.default.pencePerDay=50

# Fine rates by media type (pence per day)
fine.pencePerDay.Book=25
fine.pencePerDay.Dvd=100
fine.pencePerDay.Magazine=50
